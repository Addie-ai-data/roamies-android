name: Build Roamies Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias roamies \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass roamiespassword -keypass roamiespassword \
            -dname "CN=Roamies Mobile, OU=Roamies, O=KenKaiii, L=SanFrancisco, ST=CA, C=US"

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Roamies-Android-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Roamies-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Update GitHub Release Asset
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk roamies-v0.5.0-multillm.apk
          gh release upload v0.4.0 roamies-v0.5.0-multillm.apk --clobber || true
          cp app/build/outputs/apk/release/app-release.apk roamies-v0.4.1-stark-pomodoro.apk
          gh release upload v0.4.0 roamies-v0.4.1-stark-pomodoro.apk --clobber || true
